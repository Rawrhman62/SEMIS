name: semis_flutter
description: SEMIS - Sistem Informasi Silsilah dan Pemuliaan Domba
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  sqflite: ^2.4.1
  path: ^1.9.1
  http: ^1.2.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_small.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon_small.jpeg"
  windows:
    generate: true
    image_path: "assets/icon_small.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/
